<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pro Fab Enterprise | المنصة الإدارية المتكاملة الفائقة</title>
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مشروع برو فاب">
<link rel="stylesheet" href="style.css?v=13">
<style>
  .app-header .brand img, img.brand-logo-img {
    height: 70px !important;
    max-height: 80px !important;
    width: auto !important;
    object-fit: contain !important;
    filter: drop-shadow(0 4px 14px rgba(255, 159, 28, 0.45)) drop-shadow(0 2px 8px rgba(0,0,0,0.8)) !important;
  }
  .login-card img, .login-card img.brand-logo-img {
    width: 250px !important;
    max-width: 100% !important;
    height: auto !important;
    margin-bottom: 20px !important;
  }
  @media (max-width: 768px) {
    .app-header .brand img, img.brand-logo-img {
      height: 55px !important;
      max-height: 65px !important;
    }
  }
</style>
</head>
<body>

<div id="offlineBanner" class="offline-banner"></div>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <img src="assets/logo.png" alt="Pro Fab" class="brand-logo-img">
    <h1 data-i18n="loginTitle">المنصة الإدارية المتكاملة</h1>
    <p class="subtitle" data-i18n="loginSubtitle">Pro Fab · Professional Fabrication</p>
    <div id="loginError" class="error-msg hidden"></div>
    <form id="loginForm">
      <div class="field">
        <label data-i18n="accountLabel">اختيار الحساب / الدور الوظيفي</label>
        <select id="accountSelect" required>
          <option value="المدير">المدير (كامل الصلاحيات)</option>
          <option value="قسم المشتريات">قسم المشتريات</option>
          <option value="قسم خدمة العملاء">قسم خدمة العملاء</option>
          <option value="قسم الصيانة">قسم الصيانة</option>
          <option value="قسم الموارد البشرية">قسم الموارد البشرية</option>
          <option value="مصنع جدة">مصنع جدة</option>
          <option value="مصنع الرياض">مصنع الرياض</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="passwordLabel">كلمة المرور</label>
        <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" required data-i18n-placeholder="passwordPlaceholder">
      </div>
      <button type="submit" class="btn-primary" id="loginBtn" data-i18n="loginBtn">تسجيل الدخول</button>
    </form>
    <div class="login-lang-select">
      <button type="button" id="loginLangToggleBtn" class="login-lang-btn">🌐 English</button>
    </div>
  </div>
</div>

<!-- شاشة التطبيق الرئيسية -->
<div id="appScreen" class="hidden">
  <header class="app-header">
    <div class="brand">
      <img src="assets/logo.png" alt="Pro Fab" class="brand-logo-img">
      <div class="brand-text">Pro Fab Enterprise<span data-i18n="appSub">نظام الإدارة والتشغيل المتكامل الفائق</span></div>
    </div>
    <div class="user-control">
      <!-- زر اختيار اللغة -->
      <button id="langToggleBtn" class="lang-toggle-btn" title="تغيير اللغة / Switch Language">🌐 English</button>
      <!-- زر التبديل بين الثيم الداكن والفاتح -->
      <button id="themeToggleBtn" class="theme-toggle-btn" title="تبديل الثيم">🌙 الوضع الداكن</button>
      <span class="who"><span data-i18n="welcome">مرحباً،</span> <b id="whoAmI"></b> <span id="whoRoleBadge" class="badge-role"></span></span>
      <button class="logout-btn" id="logoutBtn" data-i18n="logout">تسجيل الخروج</button>
    </div>
  </header>

  <div class="app-body">
    <!-- الشريط الجانبي للتنقل بين الأنظمة -->
    <aside class="sidebar">
      <div class="sidebar-title">أقسام المنصة الإدارية</div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- سيتم تعبئة الأزرار ديناميكياً حسب الصلاحيات -->
      </nav>
    </aside>

    <!-- المحتوى الرئيسي للمديولات -->
    <main class="main-content" id="appContent">
      <!-- يتم تحميل المديول المختار هنا -->
    </main>
  </div>
</div>

<!-- النوافذ المنبثقة (Modals) -->

<!-- نافذة تحديد موعد زيارة الصيانة -->
<div id="scheduleModal" class="modal-overlay hidden">
  <div class="modal-card">
    <h3>🛠️ تحديد موعد زيارة فريق الصيانة للموقع</h3>
    <form id="scheduleForm">
      <input type="hidden" id="scheduleTicketId">
      <div class="field">
        <label>تاريخ الموعد</label>
        <input type="date" id="scheduleDate" required>
      </div>
      <div class="field">
        <label>توقيت الموعد</label>
        <input type="time" id="scheduleTime" required>
      </div>
      <div class="field">
        <label>اسم الفني / الفريق المسؤول</label>
        <input type="text" id="scheduleTech" placeholder="مثال: م. أحمد وفريق الصيانة" required>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-primary">تأكيد الموعد وإشعار العملاء</button>
        <button type="button" class="btn-secondary closeModalBtn">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- نافذة تسجيل عدم حل المشكلة مع الملاحظات -->
<div id="unresolvedModal" class="modal-overlay hidden">
  <div class="modal-card">
    <h3>⚠️ ملاحظات عدم حل المشكلة</h3>
    <form id="unresolvedForm">
      <input type="hidden" id="unresolvedTicketId">
      <div class="field">
        <label>سبب عدم الحل وملاحظات فني الصيانة</label>
        <textarea id="unresolvedNotes" rows="4" placeholder="اكتب التفاصيل هنا (مثال: بانتظار استيراد قطع غيار إضافية أو الحاجة لزيارة موقعية ثانية...)" required></textarea>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-danger">حفظ وتحديث التقرير</button>
        <button type="button" class="btn-secondary closeModalBtn">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- نافذة إضافة موظف / حساب جديد (للمدير) -->
<div id="addUserModal" class="modal-overlay hidden">
  <div class="modal-card">
    <h3>👤 إضافة حساب موظف / دور وظيفي جديد</h3>
    <form id="addUserForm">
      <div class="field">
        <label>اسم الحساب / الموظف</label>
        <input type="text" id="newUserName" placeholder="مثال: موظف المشتريات 2" required>
      </div>
      <div class="field">
        <label>الدور الوظيفي والصلاحية</label>
        <select id="newUserRole" required>
          <option value="قسم خدمة العملاء">قسم خدمة العملاء</option>
          <option value="قسم الصيانة">قسم الصيانة</option>
          <option value="قسم الموارد البشرية">قسم الموارد البشرية</option>
          <option value="قسم المشتريات">قسم المشتريات</option>
          <option value="مصنع جدة">مصنع جدة</option>
          <option value="مصنع الرياض">مصنع الرياض</option>
          <option value="المدير">المدير العام</option>
        </select>
      </div>
      <div class="field">
        <label>الفرع / الموقع</label>
        <select id="newUserBranch" required>
          <option value="الإدارة العامة">الإدارة العامة</option>
          <option value="جدة">مصنع جدة</option>
          <option value="الرياض">مصنع الرياض</option>
          <option value="قسم الصيانة">قسم الصيانة والخدمات</option>
          <option value="قسم خدمة العملاء">قسم خدمة العملاء</option>
          <option value="الفرع الشرقي">الفرع الشرقي (الدمام)</option>
        </select>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="newUserPassword" placeholder="أدخل كلمة مرور للحساب" required>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-primary">إنشاء الحساب</button>
        <button type="button" class="btn-secondary closeModalBtn">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- نافذة معاينة صورة المشكلة -->
<div id="imageModal" class="modal-overlay hidden">
  <div class="modal-card" style="max-width: 600px; text-align: center;">
    <h3>📷 معاينة صورة المشكلة</h3>
    <img id="imageModalPreview" src="" alt="معاينة الصورة" style="width: 100%; max-height: 400px; object-fit: contain; border-radius: 12px; margin: 12px 0;">
    <div class="modal-actions" style="justify-content: center;">
      <button type="button" class="btn-secondary closeModalBtn">إغلاق</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js?v=14"></script>
</body>
</html>
